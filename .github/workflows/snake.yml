name: Contribution Snake
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/snake@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          github_user_name: kanagaabishek
          svg_style: ""
          src: ""
          label: ""
          palette: "github"
          background: "000000"
          language_color: "false"
          language_count: "0"
          language_name: "false"
          invites: "false"
          private: "false"
          contrib_weighted: "false"
          contrib_weighted_threshold: "0"
          contrib_weighted_label: ""
          lang_depth: "2"
          lang_threshold: "0"
          lang_increments: "1"
          langs_count: "10"
          langs_sort: "frequency"
          langs_limit: "0"
          roundsrc: "false"
          deny_private: "false"
          hide_border: "false"
          hide_bottom: "false"
          hide_top: "false"
          hide_left: "false"
          hide_right: "false"
          hide_head: "false"
          hide_logo: "false"
          hide_title: "false"
          hide_stats: "false"
          hide_message: "false"
          hide_footer: "false"
          hide_git: "false"
          hide_date: "false"
          hide_lang: "false"
          hide_activity: "false"
          hide_activity_chart: "false"
          hide_activity_limit: "0"
          hide_activity_days: "0"
          hide_activity_threshold: "0"
          hide_activity_background: "false"
          hide_activity_border: "false"
          hide_activity_snake: "false"
          hide_activity_title: "false"
          hide_activity_stats: "false"
          hide_activity_message: "false"
          hide_activity_footer: "false"
          hide_activity_git: "false"
          hide_activity_date: "false"
          hide_activity_lang: "false"
          hide_activity_activity: "false"
          hide_activity_activity_chart: "false"
          hide_activity_activity_limit: "0"
          hide_activity_activity_days: "0"
          hide_activity_activity_threshold: "0"
          hide_activity_activity_background: "false"
          hide_activity_activity_border: "false"
          hide_activity_activity_snake: "false"
          hide_activity_activity_title: "false"
          hide_activity_activity_stats: "false"
          hide_activity_activity_message: "false"
          hide_activity_activity_footer: "false"
          hide_activity_activity_git: "false"
          hide_activity_activity_date: "false"
          hide_activity_activity_lang: "false"
          output: "github-contribution-grid-snake.svg"
          cache_timeout: "86400"