<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Kanaga Abishek — systems, software, and agentic AI</title>
<desc id="desc">Animated dark navy and violet developer banner with a glowing orbital network.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B19"/><stop offset=".55" stop-color="#10102A"/><stop offset="1" stop-color="#17113A"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42D9FF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".45"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<circle cx="980" cy="150" r="180" fill="url(#glow)"/>
<circle cx="980" cy="150" r="120" fill="#312E81" opacity=".18" filter="url(#blur)"/>
<g stroke="url(#line)" stroke-opacity=".32" fill="none">
  <path d="M750 40 L860 110 L1010 65 L1110 145 L1030 260 L900 225 L820 300 L720 230 Z"/>
  <path d="M860 110 L900 225 L1110 145 M1010 65 L1030 260 M750 40 L720 230"/>
  <path d="M810 75 C900 0 1080 25 1130 150 S1020 310 900 225" stroke-dasharray="5 9"/>
</g>
<g fill="#8BE9FD">
  <circle cx="750" cy="40" r="4"/><circle cx="860" cy="110" r="5"/><circle cx="1010" cy="65" r="4"/>
  <circle cx="1110" cy="145" r="5"/><circle cx="1030" cy="260" r="4"/><circle cx="900" cy="225" r="5"/>
  <circle cx="820" cy="300" r="4"/><circle cx="720" cy="230" r="4"/>
</g>
<circle cx="960" cy="165" r="54" fill="none" stroke="#A78BFA" stroke-opacity=".55" stroke-width="1.5">
  <animate attributeName="r" values="46;60;46" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".25;.8;.25" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="960" cy="165" r="31" fill="#7C3AED" fill-opacity=".12" stroke="url(#line)" stroke-width="1.5"/>
<path d="M947 151 L936 165 L947 179 M973 151 L984 165 L973 179 M966 145 L954 185" fill="none" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="66" y="76" fill="#8BE9FD" font-size="14" letter-spacing="4">ENGINEERING / SYSTEMS / AI</text>
  <text x="62" y="150" fill="#F8FAFC" font-size="55" font-weight="750">KANAGA ABISHEK</text>
  <text x="66" y="193" fill="#C4B5FD" font-size="22">Building software that explains itself.</text>
  <text x="66" y="239" fill="#A5B4FC" font-size="15">BACKEND SYSTEMS  ·  DISTRIBUTED TRACING  ·  AGENTIC AI</text>
  <rect x="66" y="276" width="194" height="34" rx="17" fill="#172554" stroke="#38BDF8" stroke-opacity=".7"/>
  <circle cx="84" cy="293" r="4" fill="#4ADE80"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="98" y="298" fill="#E0F2FE" font-size="12" letter-spacing="1.2">OPEN TO HARD PROBLEMS</text>
</g>
</svg>